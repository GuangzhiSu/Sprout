<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sprout · Practise talking</title>
<meta name="description" content="A friendly place to practise talking. Start now, or open the tracking panel for parents." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23C6E7DD'/%3E%3Ccircle cx='12' cy='15' r='1.7' fill='%2321313A'/%3E%3Ccircle cx='20' cy='15' r='1.7' fill='%2321313A'/%3E%3Cpath d='M12.5 20q3.5 2.6 7 0' fill='none' stroke='%2321313A' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>
<body>

<!-- soft background: sky, sun, clouds, hills -->
<div class="sky" aria-hidden="true">
  <span class="sun"></span>
  <span class="cloud cloud--a"></span>
  <span class="cloud cloud--b"></span>
  <span class="cloud cloud--c"></span>
  <span class="hill hill--back"></span>
  <span class="hill hill--front"></span>
</div>

<main class="stage">

  <!-- mascot -->
  <button class="mascot" id="mascot" type="button" aria-label="Say hello to Sprout">
    <svg viewBox="0 0 220 220" width="200" height="200" role="img" aria-hidden="true">
      <!-- leaves -->
      <g class="mascot__leaves">
        <path d="M108 70c-6-30-32-44-56-42-3 26 17 48 47 50z" fill="#8ECB9F"/>
        <path d="M112 70c8-28 33-40 55-36 2 25-19 46-47 48z" fill="#A9D9B6"/>
        <path d="M110 96V56" stroke="#6FB585" stroke-width="8" stroke-linecap="round" fill="none"/>
      </g>
      <!-- body -->
      <g class="mascot__body">
        <circle cx="110" cy="136" r="62" fill="#C6E7DD"/>
        <circle cx="110" cy="136" r="62" fill="none" stroke="#fff" stroke-width="7"/>
        <!-- cheeks -->
        <ellipse cx="78" cy="150" rx="12" ry="8" fill="#F8AEB2" opacity=".75"/>
        <ellipse cx="142" cy="150" rx="12" ry="8" fill="#F8AEB2" opacity=".75"/>
        <!-- eyes -->
        <g class="mascot__eyes">
          <circle cx="90" cy="128" r="7.5" fill="#21313A"/>
          <circle cx="130" cy="128" r="7.5" fill="#21313A"/>
        </g>
        <!-- smile -->
        <path d="M94 152q16 13 32 0" fill="none" stroke="#21313A" stroke-width="6" stroke-linecap="round"/>
      </g>
    </svg>
  </button>

  <!-- greeting -->
  <p class="bubble-say" id="say">Hi! I'm Sprout.</p>
  <h1 class="ask">Want to practise talking?</h1>

  <!-- the two entries -->
  <div class="doors">
    <a class="door door--play" href="/choose">
      <span class="door__icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="42" height="42" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 14l16 10-16 10z" fill="currentColor" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="door__text">
        <span class="door__title">Start now!</span>
        <span class="door__sub">Let's practise together</span>
      </span>
    </a>

    <a class="door door--panel" href="/parent">
      <span class="door__badge">For parents</span>
      <span class="door__icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="42" height="42" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 32l9-10 7 6 12-14"/>
          <path d="M10 10v28h28"/>
        </svg>
      </span>
      <span class="door__text">
        <span class="door__title">See the tracking panel</span>
        <span class="door__sub">How things are going</span>
      </span>
    </a>
  </div>

</main>

<footer class="foot">
  <p>Sprout is a research prototype. It is not a medical device and does not replace professional diagnosis or intervention.</p>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
